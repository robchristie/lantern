name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - name: Install pinned Nextest binary
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace and doctests
        run: scripts/validate.sh tests
      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: .lantern/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: Check comparison adjudication contracts
        run: python3 scripts/test-comparison-adjudicator.py

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install pinned Nextest binary
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Check minimum Rust compatibility
        run: cargo +1.85.0 check --locked --workspace --all-targets
      - name: Test minimum Rust compatibility and doctests
        run: rustup run 1.85.0 scripts/validate.sh tests
      - name: Upload minimum Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-rust-test-results
          path: .lantern/nextest/ci/junit.xml
          if-no-files-found: warn

  browser-contracts:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.lantern/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision pinned Chromium
        run: npx --yes playwright@1.62.1 install --no-shell chromium
      - name: Build Lantern
        run: cargo build --locked --workspace
      - name: Run real-Chromium browser contracts
        shell: bash
        run: |
          LANTERN_CHROMIUM="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -path '*/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' -print -quit)"
          test -n "$LANTERN_CHROMIUM"
          test -x "$LANTERN_CHROMIUM"
          export LANTERN_CHROMIUM
          scripts/test-browser-contracts.py --lantern target/debug/lantern --output-dir .lantern/browser-contracts
      - name: Upload browser contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-evidence
          path: .lantern/browser-contracts/
          if-no-files-found: error
