name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace --all-targets

  browser-contracts:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.smoogle/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision pinned Chromium
        run: npx --yes playwright@1.62.1 install --no-shell chromium
      - name: Build Lantern
        run: cargo build --locked --workspace
      - name: Run real-Chromium browser contracts
        shell: bash
        run: |
          LANTERN_CHROMIUM="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -path '*/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' -print -quit)"
          test -n "$LANTERN_CHROMIUM"
          test -x "$LANTERN_CHROMIUM"
          export LANTERN_CHROMIUM
          scripts/test-browser-contracts.py --lantern target/debug/lantern --output-dir .smoogle/browser-contracts
      - name: Upload browser contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-evidence
          path: .smoogle/browser-contracts/
          if-no-files-found: error
